name: Update README timestamp

on:
  schedule:
    - cron: '0 6 * * *' # every day at 06:00 UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update README timestamp
        run: |
          DATE="$(date -u +"%Y-%m-%d %H:%M UTC")"
          echo "Updating README with timestamp: $DATE"
          perl -0777 -pe "s/<!-- README_UPDATED -->.*?<!-- README_UPDATED_END -->/<!-- README_UPDATED -->Last updated: $DATE<!-- README_UPDATED_END -->/s" README.md > README.tmp
          mv README.tmp README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README timestamp" || echo "No changes to commit"
          git push
